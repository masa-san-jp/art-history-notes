name: agent-harness

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  pull_request:
    types: [closed]

concurrency:
  group: agent-harness-dispatcher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  dispatch:
    if: vars.AGENT_HARNESS_ENABLED == 'true' && github.event_name != 'pull_request' && (github.event_name != 'issues' || github.event.label.name == 'agent-task')
    runs-on: ubuntu-latest
    environment: agent-harness
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --frozen
      - name: Verify before dispatch
        run: uv run --locked python tools/verify.py
      - name: Execute one queue cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m agent_harness controller serve --once

  finalize:
    if: vars.AGENT_HARNESS_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: agent-harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --frozen
      - name: Finalize merged agent PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m agent_harness controller finalize --pr ${{ github.event.pull_request.number }}

  reconcile-closed:
    if: vars.AGENT_HARNESS_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    environment: agent-harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --frozen
      - name: Reconcile closed unmerged agent PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m agent_harness controller reconcile-closed --pr ${{ github.event.pull_request.number }}
