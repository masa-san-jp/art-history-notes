name: validate
# ローカルのフックは clone ごとの設定に依存する。push した時点でも必ず検証が走るようにする。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: 依存関係をlockどおりに準備
        run: uv sync --locked
      - name: 正準検証
        run: uv run --locked python tools/verify.py
